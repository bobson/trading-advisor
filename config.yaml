market:
  exchange: binance
  symbol: BTC/USDT
  timeframe: 1h              # switch to 4h later by changing this one line
  history_candles: 4320      # ~6 months of 1h candles

structure:
  swing_sensitivity: 5       # bars on each side that define a pivot (higher = only major swings)
  sr_cluster_tolerance_pct: 0.5  # how close levels must be to merge into one S/R zone
  round_number_pct: 0.5      # how close (%) price must be to a round number to be "at" it (Phase 18)

indicators:
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  fast_ma: 20
  slow_ma: 50
  volume_ma: 20              # SMA period for "average volume" (Phase 15)
  # Phase 18 toolkit (facts/context, not votes yet)
  atr_period: 14
  adx_period: 14
  adx_trend_threshold: 25    # ADX above this = trending
  stoch_k: 14
  stoch_d: 3
  stoch_oversold: 20
  stoch_overbought: 80
  bb_period: 20
  bb_stddev: 2.0

confluence:
  min_agreeing_signals: 2    # LEGACY (Phase 6) — superseded by require_categories below
  proximity_pct: 0.5         # how close (%) price must be to a level/fib for it to vote
  volume_confirm_factor: 1.2 # bar must trade >= this x its avg volume to confirm the candle (Phase 15)
  require_categories: 2      # a setup must span >= this many independent categories (Phase 17)
  category_weights:          # per-category weight in the 0-1 confidence score (NOT tuned to the backtest)
    trend: 1.0
    momentum: 1.0
    structure: 1.2
    volume: 0.8
    volatility: 0.8

patterns:
  price_tolerance_pct: 2.0   # how close two peaks/troughs count as "equal"
  min_trough_pct: 3.0        # min depth between peaks/valleys for a real reversal (anti over-call)
  flat_slope_pct: 1.0        # a trendline flatter than this (% across its span) counts as flat

mtf:
  enabled: true
  context_from: [4h, 1d]     # higher timeframes that gate the base-timeframe setup (Phase 16)

market_adaptation:
  significant_move_atr_mult: 1.5  # a "significant move" = this x ATR, volatility-relative (Phase 19)

context:                     # Phase 21 — background facts for Layer 2 (context, not prediction)
  fear_greed: true           # crypto Fear & Greed (alternative.me, no key)
  economic_calendar: true    # high-impact events (Finnhub, needs FINNHUB_API_KEY)
  news: true                 # recent headlines (Finnhub, needs FINNHUB_API_KEY)

derivatives:                 # Phase 22 — crypto perp positioning (funding + open interest), facts only
  enabled: true              # crypto-only in effect; forex has no perp funding/OI
  funding_extreme: 0.0005    # |funding per 8h| above this flags crowded positioning (contrarian)

advisor:
  model: claude-sonnet-4-6   # see docs.claude.com for current model names; used in Phase 7
  explanation_style: teaching
